<!-- Modal de réaffectation -->
<div id="reaffectationModal" class="fixed inset-0 flex items-center justify-center z-50 hidden" style="background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);">
    <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="p-6 border-b">
            <div class="flex justify-between items-center">
                <h3 class="text-2xl font-bold text-gray-800">Réaffecter la commande</h3>
                <button id="closeReaffectationModal" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            <p class="text-gray-600 mt-2">Commande: <span id="reaffectationCommandeId" class="font-semibold"></span></p>
            <p class="text-gray-600 mt-1">Opérateur actuel: <span id="reaffectationOperateurActuel" class="font-semibold text-blue-600"></span></p>
        </div>
        <div class="p-6">
            <!-- Information sur le type d'opérateur -->
            <div class="mb-6">
                <div class="bg-purple-50 border border-purple-200 rounded-lg p-4">
                    <div class="flex items-center">
                        <i class="fas fa-info-circle text-purple-500 mr-2"></i>
                        <span class="text-sm font-medium text-purple-800">
                            Réaffectation aux opérateurs de confirmation uniquement
                        </span>
                    </div>
                </div>
            </div>

            <!-- Liste des opérateurs -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-3">Sélectionner un opérateur</label>
                <div id="operateursReaffectList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {% for operateur in operateurs %}
                    <div class="operateur-card-reaffect p-3 border-2 border-gray-200 rounded-lg cursor-pointer transition-all hover:border-purple-300 hover:bg-purple-50"
                         data-operateur-id="{{ operateur.id }}"
                         onclick="selectNouvelOperateur(this, {{ operateur.id }}, '{{ operateur.get_full_name|escapejs }}')">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <div class="w-12 h-12 rounded-full bg-purple-100 flex items-center justify-center">
                                    <i class="fas fa-user text-purple-600 text-lg"></i>
                                </div>
                            </div>
                            <div class="ml-3 flex-1">
                                <p class="font-semibold text-gray-900">{{ operateur.get_full_name }}</p>
                                <p class="text-xs text-gray-500">{{ operateur.mail|default:"Non spécifié" }}</p>
                                <div class="text-xs text-purple-600 mt-1">
                                    <i class="fas fa-clipboard-list mr-1"></i>
                                    {{ operateur.commandes_count|default:0 }} commandes affectées
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <!-- Motif de réaffectation -->
            <div class="mb-6">
                <label for="reaffectationMotif" class="block text-sm font-medium text-gray-700 mb-2">Motif de réaffectation (optionnel)</label>
                <textarea id="reaffectationMotif" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500" placeholder="Expliquez pourquoi cette commande est réaffectée..."></textarea>
            </div>

            <!-- Actions -->
            <div class="flex justify-end gap-4">
                <button id="cancelReaffectationBtn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 px-6 rounded-lg transition duration-300">
                    Annuler
                </button>
                <button id="confirmReaffectationBtn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 opacity-50 cursor-not-allowed" disabled>
                    Réaffecter
                </button>
            </div>
        </div>
    </div>
</div>
