<!-- Onglet des performance commerciale - KPIs Commerciaux Yoozak -->
{% load static %}

<div class="space-y-6">
<!-- En-tête -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-gray-900">Performance Commerciale</h2>
      <div class="flex items-center gap-2 mt-1">
        <p class="text-gray-600">Analyse des ventes et performances commerciales (commandes livrées)</p>
        <span class="inline-flex items-center gap-1 px-2 py-1 bg-blue-100 text-blue-700 text-xs font-medium rounded-full" title="Le CA est calculé hors frais de livraison">
          <i class="fas fa-info-circle"></i>
          <span>CA Net (HT Livraison)</span>
        </span>
      </div>
    </div>
    <div class="flex gap-2 items-center">
      <!-- Boutons de sélection de période -->
      <div class="flex gap-1 bg-gray-100 rounded-lg p-1">
        <button onclick="window.yoozakKPI.changePeriodeVentes('7j')"
                class="periode-ventes-btn text-xs px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition-colors"
                data-period="7j">
          7 jours
        </button>
        <button onclick="window.yoozakKPI.changePeriodeVentes('30j')"
                class="periode-ventes-btn text-xs px-3 py-1.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors"
                data-period="30j">
          30 jours
        </button>
        <button onclick="window.yoozakKPI.changePeriodeVentes('90j')"
                class="periode-ventes-btn text-xs px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition-colors"
                data-period="90j">
          90 jours
        </button>
        <button onclick="window.yoozakKPI.changePeriodeVentes('mois')"
                class="periode-ventes-btn text-xs px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition-colors"
                data-period="mois">
          Ce mois
        </button>
      </div>
    </div>
  </div>


</div>
