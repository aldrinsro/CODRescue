<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 pt-4 border-t border-gray-200">
    <!-- Filtre par date de création -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="fas fa-calendar-plus mr-1"></i>Date de création
        </label>
        <select id="dateFilterSelect" name="date_filter" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 mb-2">
            <option value="">Toutes les dates</option>
            <option value="aujourd'hui">Aujourd'hui</option>
            <option value="hier">Hier</option>
            <option value="cette semaine">Cette semaine</option>
            <option value="7 derniers jours">7 derniers jours</option>
            <option value="30 derniers jours">30 derniers jours</option>
            <option value="ce mois">Ce mois</option>
            <option value="le mois dernier">Le mois dernier</option>
            <option value="custom">Intervalle personnalisé...</option>
        </select>
        <div id="customDateRange" class="hidden space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Du</label>
                    <input type="date" name="date_start" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Au</label>
                    <input type="date" name="date_end" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
            </div>
        </div>
    </div>

    <!-- Filtre par date de commande -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="fas fa-calendar-alt mr-1"></i>Date de commande
        </label>
        <select id="dateCmdFilterSelect" name="date_cmd_filter" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 mb-2">
            <option value="">Toutes les dates</option>
            <option value="aujourd'hui">Aujourd'hui</option>
            <option value="hier">Hier</option>
            <option value="cette semaine">Cette semaine</option>
            <option value="7 derniers jours">7 derniers jours</option>
            <option value="30 derniers jours">30 derniers jours</option>
            <option value="ce mois">Ce mois</option>
            <option value="le mois dernier">Le mois dernier</option>
            <option value="custom">Intervalle personnalisé...</option>
        </select>
        <div id="customDateCmdRange" class="hidden space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Du</label>
                    <input type="date" name="date_cmd_start" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Au</label>
                    <input type="date" name="date_cmd_end" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
            </div>
        </div>
    </div>

    <!-- Filtre Synchronisation -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="fas fa-sync-alt mr-1"></i>Synchronisation
        </label>
        <select name="sync_filter" id="syncFilter" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 mb-2">
            <option value="">Toutes</option>
            <option value="last_minute">Dernière minute</option>
            <option value="last_hour">Dernière heure</option>
            <option value="today">Aujourd'hui</option>
            <option value="last_24_hours">24 heures</option>
            <option value="last_7_days">7 jours</option>
            <option value="custom">Intervalle personnalisé...</option>
        </select>
        <div id="customSyncRange" class="hidden space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Du</label>
                    <input type="date" name="sync_date_start" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Au</label>
                    <input type="date" name="sync_date_end" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
            </div>
        </div>
    </div>

    <!-- Filtre Ordre/Tri -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="fas fa-sort mr-1"></i>Trier par
        </label>
        <select name="order_by" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="">Par défaut</option>
            <optgroup label="Date de création">
                <option value="-date_creation">➜ Plus récent</option>
                <option value="date_creation">➜ Plus ancien</option>
            </optgroup>
            <optgroup label="Total">
                <option value="-total_cmd">➜ Plus élevé</option>
                <option value="total_cmd">➜ Plus bas</option>
            </optgroup>
            <optgroup label="Autre">
                <option value="client__nom">➜ Client A-Z</option>
                <option value="-client__nom">➜ Client Z-A</option>
                <option value="id_yz">➜ N° Commande croissant</option>
                <option value="-id_yz">➜ N° Commande décroissant</option>
            </optgroup>
        </select>
    </div>
</div>

<script>
// Restaurer les valeurs sélectionnées depuis l'URL
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);

    // Date filter
    const dateFilter = urlParams.get('date_filter');
    if (dateFilter) {
        const select = document.getElementById('dateFilterSelect');
        if (select) select.value = dateFilter;
        if (dateFilter === 'custom') {
            document.getElementById('customDateRange').classList.remove('hidden');
        }
    }

    // Date start/end
    const dateStart = urlParams.get('date_start');
    const dateEnd = urlParams.get('date_end');
    if (dateStart) document.querySelector('input[name="date_start"]').value = dateStart;
    if (dateEnd) document.querySelector('input[name="date_end"]').value = dateEnd;
    if (dateStart || dateEnd) {
        document.getElementById('dateFilterSelect').value = 'custom';
        document.getElementById('customDateRange').classList.remove('hidden');
    }

    // Date cmd filter
    const dateCmdFilter = urlParams.get('date_cmd_filter');
    if (dateCmdFilter) {
        const select = document.getElementById('dateCmdFilterSelect');
        if (select) select.value = dateCmdFilter;
        if (dateCmdFilter === 'custom') {
            document.getElementById('customDateCmdRange').classList.remove('hidden');
        }
    }

    // Date cmd start/end
    const dateCmdStart = urlParams.get('date_cmd_start');
    const dateCmdEnd = urlParams.get('date_cmd_end');
    if (dateCmdStart) document.querySelector('input[name="date_cmd_start"]').value = dateCmdStart;
    if (dateCmdEnd) document.querySelector('input[name="date_cmd_end"]').value = dateCmdEnd;
    if (dateCmdStart || dateCmdEnd) {
        document.getElementById('dateCmdFilterSelect').value = 'custom';
        document.getElementById('customDateCmdRange').classList.remove('hidden');
    }

    // Sync filter
    const syncFilter = urlParams.get('sync_filter');
    if (syncFilter) {
        document.getElementById('syncFilter').value = syncFilter;
        if (syncFilter === 'custom') {
            document.getElementById('customSyncRange').classList.remove('hidden');
        }
    }

    // Sync date start/end
    const syncDateStart = urlParams.get('sync_date_start');
    const syncDateEnd = urlParams.get('sync_date_end');
    if (syncDateStart) document.querySelector('input[name="sync_date_start"]').value = syncDateStart;
    if (syncDateEnd) document.querySelector('input[name="sync_date_end"]').value = syncDateEnd;
    if (syncDateStart || syncDateEnd) {
        document.getElementById('syncFilter').value = 'custom';
        document.getElementById('customSyncRange').classList.remove('hidden');
    }

    // Order by
    const orderBy = urlParams.get('order_by');
    if (orderBy) document.querySelector('select[name="order_by"]').value = orderBy;
});
</script>
