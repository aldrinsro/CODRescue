<!-- Filtres réutilisables pour toute l'application -->
<!-- Usage: {% include 'common/filters.html' %} -->

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pt-4 border-t border-gray-200">

    <!-- Filtre par date -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="fas fa-calendar-alt mr-1"></i>Date de création
        </label>
        <select id="dateFilterSelect" name="date_filter" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 mb-2">
            <option value="">Toutes les dates</option>
            <option value="aujourd'hui" {% if date_filter == "aujourd'hui" %}selected{% endif %}>Aujourd'hui</option>
            <option value="hier" {% if date_filter == "hier" %}selected{% endif %}>Hier</option>
            <option value="cette semaine" {% if date_filter == "cette semaine" %}selected{% endif %}>Cette semaine</option>
            <option value="7 derniers jours" {% if date_filter == "7 derniers jours" %}selected{% endif %}>7 derniers jours</option>
            <option value="30 derniers jours" {% if date_filter == "30 derniers jours" %}selected{% endif %}>30 derniers jours</option>
            <option value="ce mois" {% if date_filter == "ce mois" %}selected{% endif %}>Ce mois</option>
            <option value="le mois dernier" {% if date_filter == "le mois dernier" %}selected{% endif %}>Le mois dernier</option>
            <option value="custom" {% if request.GET.date_start or request.GET.date_end %}selected{% endif %}>Intervalle personnalisé...</option>
        </select>

        <!-- Intervalle de dates personnalisé -->
        <div id="customDateRange" class="{% if not request.GET.date_start and not request.GET.date_end %}hidden{% endif %} space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Du</label>
                    <input type="date" name="date_start" value="{{ request.GET.date_start }}"
                           class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Au</label>
                    <input type="date" name="date_end" value="{{ request.GET.date_end }}"
                           class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
            </div>
        </div>
    </div>

    <!-- Filtre Synchronisation -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="fas fa-sync-alt mr-1"></i>Synchronisation
        </label>
        <select name="sync_filter" id="syncFilter" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="">Toutes</option>
            <option value="last_minute" {% if sync_filter == 'last_minute' %}selected{% endif %}>Dernière minute</option>
            <option value="last_hour" {% if sync_filter == 'last_hour' %}selected{% endif %}>Dernière heure</option>
            <option value="today" {% if sync_filter == 'today' %}selected{% endif %}>Aujourd'hui</option>
            <option value="last_24_hours" {% if sync_filter == 'last_24_hours' %}selected{% endif %}>24 heures</option>
            <option value="last_7_days" {% if sync_filter == 'last_7_days' %}selected{% endif %}>7 jours</option>
            <option value="custom_date" {% if sync_filter == 'custom_date' %}selected{% endif %}>Personnalisée</option>
        </select>
        <input type="date" name="custom_sync_date" id="customSyncDate"
               value="{{ custom_sync_date|default:'' }}"
               class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 mt-2 {% if sync_filter != 'custom_date' %}hidden{% endif %}">
    </div>

    <!-- Filtre Ordre/Tri -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="fas fa-sort mr-1"></i>Trier par
        </label>
        <select name="order_by" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="">Par défaut</option>
            <optgroup label="Date de création">
                <option value="-date_creation" {% if order_by == '-date_creation' %}selected{% endif %}>➜ Plus récent</option>
                <option value="date_creation" {% if order_by == 'date_creation' %}selected{% endif %}>➜ Plus ancien</option>
            </optgroup>
            <optgroup label="Total">
                <option value="-total_cmd" {% if order_by == '-total_cmd' %}selected{% endif %}>➜ Plus élevé</option>
                <option value="total_cmd" {% if order_by == 'total_cmd' %}selected{% endif %}>➜ Plus bas</option>
            </optgroup>
            <optgroup label="Autre">
                <option value="client__nom" {% if order_by == 'client__nom' %}selected{% endif %}>➜ Client A-Z</option>
                <option value="-client__nom" {% if order_by == '-client__nom' %}selected{% endif %}>➜ Client Z-A</option>
                <option value="id_yz" {% if order_by == 'id_yz' %}selected{% endif %}>➜ N° ID croissant</option>
                <option value="-id_yz" {% if order_by == '-id_yz' %}selected{% endif %}>➜ N° ID décroissant</option>
            </optgroup>
        </select>
    </div>
</div>
